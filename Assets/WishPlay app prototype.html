<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WishPlay app prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#E6E2F0; --frame:#16132E;
  --surface:#FBF9FF; --sc:#F1EEF8; --sch:#E8E4F2; --schh:#DDD8EC;
  --on:#16132E; --onv:#4A4663; --outline:#77728F; --outv:#CAC5DA;
  --primary:#2E2766; --onprimary:#FFFFFF;
  --pc:#FFB938; --onpc:#2B1C00;
  --sec:#E4DFFF; --onsec:#231A5C;
  --ter:#5B3FE0; --terc:#E6DEFF; --onterc:#21105E;
  --err:#B3261E; --errc:#F9DEDC; --onerrc:#410E0B;
  --ok:#1E6E47; --okc:#CDEFD9;
  --track:#D9D4E8; --scrim:rgba(22,19,46,.48);
  --spring:cubic-bezier(.2,1.35,.3,1);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#0B0A17; --frame:#2F2C4B;
    --surface:#131124; --sc:#1C1A33; --sch:#25223F; --schh:#302D4C;
    --on:#EDEAF7; --onv:#C3BED7; --outline:#938EAB; --outv:#46425F;
    --primary:#FFB938; --onprimary:#2B1C00;
    --pc:#FFB938; --onpc:#2B1C00;
    --sec:#342D6B; --onsec:#E4DFFF;
    --ter:#B9A8FF; --terc:#3C2C8F; --onterc:#E6DEFF;
    --err:#F2B8B5; --errc:#601410; --onerrc:#F9DEDC;
    --ok:#7ED3A4; --okc:#0F3D27;
    --track:#3A3657; --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --page:#0B0A17; --frame:#2F2C4B;
  --surface:#131124; --sc:#1C1A33; --sch:#25223F; --schh:#302D4C;
  --on:#EDEAF7; --onv:#C3BED7; --outline:#938EAB; --outv:#46425F;
  --primary:#FFB938; --onprimary:#2B1C00;
  --pc:#FFB938; --onpc:#2B1C00;
  --sec:#342D6B; --onsec:#E4DFFF;
  --ter:#B9A8FF; --terc:#3C2C8F; --onterc:#E6DEFF;
  --err:#F2B8B5; --errc:#601410; --onerrc:#F9DEDC;
  --ok:#7ED3A4; --okc:#0F3D27;
  --track:#3A3657; --scrim:rgba(0,0,0,.6);
}
.accent-violet{--pc:#B9A8FF; --onpc:#21105E}
.accent-teal{--pc:#6ED6C4; --onpc:#00382F}
.accent-coral{--pc:#FF9E8A; --onpc:#4A0E00}

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--on);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ter);outline-offset:2px}

.stage{min-height:100%;display:flex;gap:56px;align-items:center;justify-content:center;padding:24px}
.demo{width:270px;display:flex;flex-direction:column;gap:22px}
.demo-brand{display:flex;align-items:center;gap:12px}
.demo-brand b{font:800 26px/1 var(--display);letter-spacing:-.03em}
.demo p{margin:0;color:var(--onv);font-size:14px}
.demo h3{margin:0 0 10px;font:700 15px/1.2 var(--body)}
.demo .row{display:flex;flex-wrap:wrap;gap:8px}

.device{position:relative;width:392px;height:min(860px,calc(100svh - 48px));min-height:640px;border:10px solid var(--frame);border-radius:54px;background:var(--surface);overflow:hidden;flex-shrink:0}
@media (max-width:760px){
  .stage{flex-direction:column;padding:0;gap:0}
  .device{width:100%;height:100svh;min-height:0;border:0;border-radius:0}
  .demo{width:auto;padding:28px 20px 40px}
}
#app{position:absolute;inset:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--surface)}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:128px}
.scroll.nonav{padding-bottom:40px}
.in-fwd{animation:inF .46s var(--spring)}
.in-back{animation:inB .46s var(--spring)}
.in-fade{animation:inFade .3s ease-out}
@keyframes inF{from{transform:translateX(28px);opacity:0}}
@keyframes inB{from{transform:translateX(-28px);opacity:0}}
@keyframes inFade{from{opacity:0}}

/* type */
.display{font:800 36px/1.02 var(--display);letter-spacing:-.03em;margin:0}
.h1{font:800 28px/1.08 var(--display);letter-spacing:-.025em;margin:0}
.h2{font:700 19px/1.2 var(--display);letter-spacing:-.01em;margin:0}
.muted{color:var(--onv)}
.small{font-size:13px}
.sec{padding:28px 20px 0}
.sec > .h2{margin-bottom:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border:0;border-radius:24px;font-weight:600;font-size:15px;transition:border-radius .3s var(--spring),transform .25s var(--spring),background .2s;white-space:nowrap}
.btn:active{border-radius:12px;transform:scale(.97)}
.btn svg{width:20px;height:20px}
.filled{background:var(--primary);color:var(--onprimary)}
.gold{background:var(--pc);color:var(--onpc)}
.tonal{background:var(--sec);color:var(--onsec)}
.outlined{background:transparent;border:1px solid var(--outline);color:var(--on)}
.textbtn{background:transparent;color:var(--primary);padding:0 12px}
:root[data-theme="dark"] .textbtn{color:var(--pc)}
.danger{background:transparent;color:var(--err);border:1px solid var(--outv)}
.lg{height:60px;border-radius:30px;font-size:17px;padding:0 28px}
.lg:active{border-radius:16px}
.block{width:100%}
.ib{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:24px;border:0;background:transparent;transition:border-radius .3s var(--spring),background .2s;flex-shrink:0}
.ib:active{border-radius:14px}
.ib svg{width:24px;height:24px}
.ib.t{background:var(--sec);color:var(--onsec)}
.ib.onimg{background:rgba(22,19,46,.55);color:#fff}
.ib.on{background:var(--pc);color:var(--onpc)}

/* chips & groups */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border:1px solid var(--outv);border-radius:12px;background:transparent;font-weight:600;font-size:14px;white-space:nowrap;transition:border-radius .35s var(--spring),background .2s}
.chip svg{width:18px;height:18px}
.chip.on{background:var(--sec);color:var(--onsec);border-color:transparent;border-radius:19px}
.chip:active{transform:scale(.96)}
.seg{display:flex;gap:3px}
.seg button{flex:1;height:44px;border:0;background:var(--sch);font-weight:600;font-size:14px;border-radius:8px;transition:border-radius .35s var(--spring),background .2s}
.seg button:first-child{border-radius:22px 8px 8px 22px}
.seg button:last-child{border-radius:8px 22px 22px 8px}
.seg button.on{background:var(--primary);color:var(--onprimary);border-radius:22px}

/* lists */
.group{display:flex;flex-direction:column;gap:3px;margin:0 16px}
.li{display:flex;align-items:center;gap:14px;width:100%;min-height:76px;padding:12px 16px;border:0;border-radius:8px;background:var(--sc);text-align:left;transition:background .2s,border-radius .3s var(--spring)}
.li:active{background:var(--sch);border-radius:20px}
.group > :first-child{border-top-left-radius:26px;border-top-right-radius:26px}
.group > :last-child{border-bottom-left-radius:26px;border-bottom-right-radius:26px}
.li-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.li-title{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-sub{font-size:13px;color:var(--onv);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.when{font-weight:700;font-size:13px;text-align:right;white-space:nowrap;padding:6px 10px;border-radius:10px;background:var(--sch)}
.when.soon{background:var(--pc);color:var(--onpc)}
.when.out{background:var(--okc);color:var(--ok)}
.when.tba{background:transparent;border:1.5px dashed var(--outline);color:var(--onv)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--terc);color:var(--onterc)}
.tag svg{width:13px;height:13px}
.row-li{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--sc);border-radius:8px;min-height:64px}
.row-li .grow{flex:1;min-width:0}
.row-li b{display:block;font-weight:700}
.row-li .ic{width:40px;height:40px;border-radius:14px;background:var(--sch);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row-li .ic svg{width:22px;height:22px}
.row-li > svg{width:22px;height:22px;flex-shrink:0;color:var(--onv)}
button.row-li{width:100%;border:0;text-align:left}

/* logos & covers */
.logo{position:relative;width:52px;height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.logo svg{position:absolute;inset:0;width:100%;height:100%}
.logo span{position:relative;font:800 18px/1 var(--display);color:#fff;letter-spacing:-.02em}
.cover{position:relative;height:236px;overflow:hidden}
.cover > svg{position:absolute;inset:0;width:100%;height:100%}
.cover-top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:2}

/* switch */
.sw{position:relative;width:52px;height:32px;border-radius:16px;border:2px solid var(--outline);background:var(--sch);flex-shrink:0;padding:0;transition:background .2s,border-color .2s}
.sw::after{content:"";position:absolute;top:50%;left:6px;width:16px;height:16px;border-radius:50%;background:var(--outline);transform:translateY(-50%);transition:left .35s var(--spring),width .35s var(--spring),height .35s var(--spring),background .2s}
.sw[aria-checked="true"]{background:var(--primary);border-color:var(--primary)}
.sw[aria-checked="true"]::after{left:24px;width:24px;height:24px;background:var(--onprimary)}
.sw:disabled{opacity:.45}

/* fields */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
.input{height:56px;border:1px solid var(--outline);border-radius:16px;background:var(--surface);color:var(--on);padding:0 16px;font:16px var(--body);width:100%}
textarea.input{height:96px;padding:14px 16px;resize:none}
.input:focus{outline:none;border:2px solid var(--primary);padding:0 15px}
textarea.input:focus{padding:13px 15px}
.err{color:var(--err);font-size:13px;font-weight:600}
.check{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--primary)}

/* search */
.searchbar{display:flex;align-items:center;gap:4px;height:58px;margin:12px 16px 8px;padding:0 6px 0 18px;border-radius:29px;background:var(--sch)}
.searchbar svg{width:22px;height:22px;flex-shrink:0}
.searchbar input{flex:1;min-width:0;height:100%;border:0;background:transparent;color:var(--on);font:16px var(--body);padding:0 8px}
.searchbar input:focus{outline:none}
.addbtn{width:48px;height:48px;border-radius:16px;border:0;background:var(--sec);color:var(--onsec);display:flex;align-items:center;justify-content:center;transition:border-radius .35s var(--spring),background .2s;flex-shrink:0}
.addbtn svg{width:22px;height:22px}
.addbtn.done{background:var(--primary);color:var(--onprimary);border-radius:24px}

/* hero */
.hero{margin:8px 16px 0;padding:22px;background:var(--pc);color:var(--onpc);border-radius:36px 36px 36px 12px;display:flex;flex-direction:column;gap:14px;border:0;text-align:left;width:calc(100% - 32px);transition:border-radius .4s var(--spring)}
.hero:active{border-radius:22px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero-num{font:800 88px/.82 var(--display);letter-spacing:-.05em}
.hero-unit{font:700 20px/1 var(--display);margin-left:4px}
.hero .logo{width:64px;height:64px}
.wave{display:block;max-width:100%;height:auto;color:currentColor;overflow:visible}
.wave-path{animation:wv 1.2s linear infinite}
@keyframes wv{from{transform:translateX(-16px)}to{transform:translateX(0)}}

/* nav & fab */
.nav{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--sc);display:flex;padding:10px 4px 14px;z-index:5}
.nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--onv)}
.nav .ind{width:56px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;transition:background .25s,width .4s var(--spring)}
.nav .ind svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--on)}
.nav button[aria-current="page"] .ind{background:var(--sec);color:var(--onsec);width:64px}
.fab{position:absolute;right:16px;bottom:100px;height:64px;padding:0 22px 0 18px;border:0;border-radius:22px;background:var(--pc);color:var(--onpc);display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;z-index:7;transition:border-radius .4s var(--spring),padding .4s var(--spring),transform .3s var(--spring)}
.fab svg{width:26px;height:26px;transition:transform .4s var(--spring)}
.fab:active{transform:scale(.95)}
.fab.open{border-radius:32px;padding:0 19px}
.fab.open svg{transform:rotate(45deg)}
.fab-menu{position:absolute;right:16px;bottom:176px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:7}
.fab-menu button{height:56px;padding:0 22px 0 18px;border:0;border-radius:28px;background:var(--pc);color:var(--onpc);display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;animation:fabIn .4s var(--spring) both}
.fab-menu button:nth-child(2){animation-delay:.05s}
.fab-menu svg{width:22px;height:22px}
@keyframes fabIn{from{transform:translateY(16px) scale(.9);opacity:0}}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:6;border:0;animation:inFade .25s ease-out}

/* app bar */
.appbar{display:flex;align-items:center;gap:6px;padding:10px 8px 6px;min-height:64px}
.appbar .h2{flex:1}
.tabhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:20px 20px 12px}

/* sheet & snack */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;background:var(--sc);border-radius:32px 32px 0 0;padding:10px 24px 32px;display:flex;flex-direction:column;gap:16px;max-height:88%;overflow-y:auto;animation:sheetIn .45s var(--spring)}
.sheet .handle{width:36px;height:4px;border-radius:2px;background:var(--outline);align-self:center;margin-bottom:6px;opacity:.6}
@keyframes sheetIn{from{transform:translateY(40px);opacity:0}}
.snack{position:absolute;left:16px;right:16px;bottom:100px;z-index:12;background:var(--on);color:var(--surface);padding:14px 18px;border-radius:16px;font-weight:600;font-size:14px;animation:sheetIn .35s var(--spring)}
.snack.nonav{bottom:24px}

/* misc */
.card{background:var(--sc);border-radius:28px;padding:20px}
.stat{flex:1;background:var(--sc);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:2px}
.stat b{font:800 32px/1 var(--display);letter-spacing:-.03em}
.stats{display:flex;gap:8px;padding:0 16px}
.kv{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--outv)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--onv);flex-shrink:0}
.kv span:last-child{font-weight:600;text-align:right}
.tba-text{color:var(--onv);font-style:italic;font-weight:500 !important}
.trailer{position:relative;aspect-ratio:16/9;border-radius:28px;overflow:hidden;border:0;width:100%;padding:0;background:#16132E;display:block}
.trailer > svg{position:absolute;inset:0;width:100%;height:100%}
.trailer .play{position:absolute;left:50%;top:50%;width:76px;height:76px;transform:translate(-50%,-50%);transition:transform .35s var(--spring)}
.trailer:active .play{transform:translate(-50%,-50%) scale(.9) rotate(20deg)}
.trailer .cap{position:absolute;left:16px;bottom:14px;color:#fff;font-weight:700;font-size:14px}
.empty{margin:24px 20px;padding:28px 22px;border-radius:32px;background:var(--sc);display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.pro-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 6px;border-radius:14px;background:var(--pc);color:var(--onpc);font-weight:700;font-size:13px}
.pro-badge svg{width:18px;height:18px}
.lock{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:9px;background:var(--pc);color:var(--onpc)}
.lock svg{width:13px;height:13px}
.swatches{display:flex;gap:12px}
.swatch{width:52px;height:52px;border-radius:18px;border:3px solid transparent;position:relative;transition:border-radius .35s var(--spring)}
.swatch.on{border-color:var(--on);border-radius:26px}
.swatch svg{position:absolute;inset:0;margin:auto;width:20px;height:20px}
.timeline-date{width:52px;height:56px;border-radius:18px;background:var(--pc);color:var(--onpc);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.timeline-date b{font:800 22px/1 var(--display)}
.timeline-date span{font-size:11px;font-weight:700}
.codebox{font:600 15px/1.2 ui-monospace,"Cascadia Mono",Menlo,monospace;letter-spacing:.02em}
.widget{border-radius:28px;background:var(--pc);color:var(--onpc);padding:16px 18px;display:flex;gap:14px;align-items:center}
.cookie-wrap{position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cookie-wrap > svg{position:absolute;inset:0;width:100%;height:100%}
.cookie-wrap > span{position:relative;font:800 24px/1 var(--display)}
.spacer{height:12px}

/* section headers inside grouped lists */
.grouphead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:22px 22px 8px;font:700 12px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--onv)}
.grouphead span:last-child{letter-spacing:0;text-transform:none;font-size:13px;font-weight:600}

/* onboarding steps */
.steps{display:flex;gap:6px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--track);transition:background .35s var(--spring)}
.steps i.on{background:var(--pc)}
.onbwrap{display:flex;flex-direction:column;height:100%;padding:18px 24px 28px;gap:20px}
.onbbody{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:20px}
.pickgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:flex;align-items:center;gap:10px;min-height:62px;padding:12px 14px;border:1.5px solid var(--outv);border-radius:20px;background:transparent;font-weight:700;font-size:15px;text-align:left;transition:border-radius .35s var(--spring),background .2s,border-color .2s}
.pick .pi{width:34px;height:34px;border-radius:12px;background:var(--sch);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pick .pi svg{width:19px;height:19px}
.pick.on{background:var(--sec);color:var(--onsec);border-color:transparent;border-radius:28px}
.pick.on .pi{background:var(--pc);color:var(--onpc)}

/* notification preview card */
.notifmock{background:var(--surface);border:1px solid var(--outv);border-radius:20px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.notifmock .nm-ic{width:28px;height:28px;border-radius:9px;background:var(--pc);color:var(--onpc);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.notifmock .nm-ic svg{width:17px;height:17px}
.notifmock b{display:block;font-size:14px}
.notifmock p{margin:2px 0 0;font-size:13px;color:var(--onv)}

/* quick actions on details */
.quick{display:flex;gap:8px;padding:16px 20px 0}
.quick .btn{flex:1;min-width:0}
.quick .ib{border:1px solid var(--outv)}
.quick .ib.on{border-color:transparent}

/* free vs Pro comparison */
.cmp{display:grid;grid-template-columns:1fr 60px 60px;align-items:center}
.cmp > *{padding:12px 0;border-bottom:1px solid var(--outv)}
.cmp .ch{font:700 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--onv);text-align:center}
.cmp .cv{text-align:center;font-weight:700}
.cmp .cv svg{width:18px;height:18px}
.cmp .cv.no{color:var(--onv);opacity:.5}
.cmp .cv.yes{color:var(--ok)}

/* Release calendar: month grid with a dot on every day something lands, agenda under the selection */
function calendarScreen(){
  const [y,m]=S.calMonth.split('-').map(Number);
  const first=new Date(y,m-1,1), lead=(first.getDay()+6)%7, dim=new Date(y,m,0).getDate();
  const byDay={};
  /* a game can land on two days when its platforms stagger, so each entry carries its own platforms */
  listGames().forEach(g=>{Object.entries(g.platforms).forEach(([p,d])=>{
    if(!d||d.slice(0,7)!==S.calMonth)return;
    const n=+d.slice(8,10);const list=byDay[n]=byDay[n]||[];
    const hit=list.find(e=>e.g===g);
    if(hit)hit.plats.push(p);else list.push({g,plats:[p]});
  })});
  const sel=S.calDay&&byDay[S.calDay]?S.calDay:null;
  const shift=n=>{const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
  const cells=[];
  for(let i=0;i<lead;i++)cells.push('<span class="calday mute" aria-hidden="true"></span>');
  for(let d=1;d<=dim;d++){
    const has=!!byDay[d], isSel=sel===d, isToday=S.calMonth==='2026-09'&&d===30;
    cells.push(`<button class="calday ${has?'has':''} ${isSel?'on':''}" ${has?`data-act="cal-day" data-arg="${d}"`:'disabled'} aria-label="${MONFULL[m-1]} ${d}${has?', '+byDay[d].length+' release'+(byDay[d].length===1?'':'s'):', nothing scheduled'}" aria-pressed="${isSel}"><span style="${isToday?'text-decoration:underline;text-underline-offset:3px':''}">${d}</span>${has?'<span class="dot"></span>':''}</button>`);
  }
  const monthGames=Object.keys(byDay).map(Number).sort((a,b)=>a-b);
  const listFor=sel?[[sel,byDay[sel]]]:monthGames.map(d=>[d,byDay[d]]);
  return `<div class="screen"><div class="appbar"><button class="ib" data-act="back" aria-label="Back">${ic('back')}</button><h1 class="h2">Release calendar</h1></div>
  <div class="scroll nonav">
    <div class="calnav">
      <button class="ib" data-act="cal-month" data-arg="${shift(-1)}" aria-label="Previous month">${ic('chevleft')}</button>
      <b>${MONFULL[m-1]} ${y}</b>
      <button class="ib" data-act="cal-month" data-arg="${shift(1)}" aria-label="Next month">${ic('chev')}</button>
    </div>
    <div class="calgrid" aria-hidden="true">${DOW.map(d=>`<span class="caldow">${d}</span>`).join('')}</div>
    <div class="calgrid" role="grid" aria-label="${MONFULL[m-1]} ${y}">${cells.join('')}</div>
    <div class="grouphead"><span>${sel?MONFULL[m-1]+' '+sel:'Everything this month'}</span>${sel?`<button class="textbtn btn" style="height:30px;padding:0 6px;letter-spacing:0;text-transform:none" data-act="cal-day" data-arg="0">Show the whole month</button>`:`<span>${monthGames.length} day${monthGames.length===1?'':'s'}</span>`}</div>
    ${monthGames.length?listFor.map(([d,gs])=>`<div class="group" style="margin-bottom:8px">${gs.map(({g,plats})=>`<button class="row-li" data-act="open" data-arg="${g.id}"><span class="timeline-date"><b>${d}</b><span>${MON[m-1]}</span></span><span class="grow"><b>${esc(g.title)}</b><span class="muted small">${esc(plats.map(p=>PSHORT[p]).join(', '))}${g.moved?' &middot; moved from '+fmt(g.moved):''}</span></span></button>`).join('')}</div>`).join(''):`<div class="empty"><b class="h2">Nothing lands in ${MONFULL[m-1]}</b><p class="muted" style="margin:0">Swipe to another month, or add more games to your list.</p><button class="btn tonal" data-act="cal-month" data-arg="${shift(1)}">Next month</button></div>`}
    <p class="muted small" style="padding:8px 20px 0">Only games on your wishlist with a known date appear here. Games waiting on a date stay in the Date TBA filter.</p>
  </div></div>`;
}

function details(id){
  const g=byId(id);const plats=Object.keys(g.platforms);const sp=S.selPlat[id]||plats[0];const d=g.platforms[sp];
  let rel;
  if(!d)rel=`<div class="card" style="border:2px dashed var(--outv);background:transparent;display:flex;flex-direction:column;gap:6px"><span class="muted small" style="font-weight:700">Release date</span><b class="h1">To be announced</b><span class="muted">${g.tba?'Expected in '+g.tba+'. ':''}We'll alert you the moment a date is set.</span></div>`;
  else{const n=days(d);
    if(n<=0)rel=`<div class="card" style="background:var(--okc);color:var(--ok);display:flex;flex-direction:column;gap:4px"><span class="small" style="font-weight:700">Out now on ${PSHORT[sp]}</span><b class="h1">Released ${fmtY(d)}</b></div>`;
    else rel=`<div class="hero" style="margin:0;width:100%;border-radius:32px 32px 32px 12px"><span class="hero-top"><span><span class="small" style="font-weight:700">${g.custom?'Your date':'Releases'} ${fmtY(d)}</span><br><span class="hero-num" style="font-size:72px">${n}</span><span class="hero-unit">${n===1?'day to go':'days to go'}</span></span></span>${wave(g.progress,290)}${g.moved?`<span class="small" style="font-weight:700;display:flex;gap:6px;align-items:center">${ic('moved')} Delayed from ${fmt(g.moved)}</span>`:''}</div>`;}
  let reqs='';
  if(!g.custom){
    if(sp==='PC'){
      const r=g.reqs&&g.reqs[S.reqMode];const keys=['OS','CPU','GPU','RAM'];
      reqs=`<div class="sec"><h2 class="h2">System requirements</h2><div class="seg" role="group" aria-label="Requirement level" style="margin-bottom:6px"><button class="${S.reqMode==='min'?'on':''}" data-act="req" data-arg="min" aria-pressed="${S.reqMode==='min'}">Minimum</button><button class="${S.reqMode==='rec'?'on':''}" data-act="req" data-arg="rec" aria-pressed="${S.reqMode==='rec'}">Recommended</button></div>
      <div>${keys.map(k=>`<div class="kv"><span>${k}</span><span class="${r?'':'tba-text'}">${r?esc(r[k]):'Will be shared later'}</span></div>`).join('')}</div></div>`;
    }else if(sp==='Android'||sp==='iOS'){
      reqs=`<div class="sec"><h2 class="h2">Requirements</h2><div class="kv"><span>${sp}</span><span>${MOBREQ[sp]}</span></div></div>`;
    }else reqs=`<div class="sec"><h2 class="h2">Requirements</h2><p class="muted" style="margin:0">Runs on any ${PSHORT[sp]}. No extra hardware needed.</p></div>`;
  }
  const size=g.size&&g.size[sp];
  const priceSec=(sp==='PC'&&g.price)?`<div class="sec"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h2 class="h2">Price on ${g.price.store}</h2>${isPro()?'':lockTag()}</div>
    <div class="card" style="display:flex;flex-direction:column;gap:14px"><div style="display:flex;align-items:baseline;gap:10px"><b style="font:800 32px/1 var(--display)">${g.price.now}</b>${g.price.was?`<s class="muted">${g.price.was}</s><span class="tag" style="background:var(--okc);color:var(--ok)">20% off</span>`:''}</div>
    <div style="display:flex;align-items:center;gap:12px"><span class="grow" style="flex:1"><b>Alert me when the price drops</b></span>${isPro()?sw(!!g.priceAlert,'pricealert','','Price drop alert'):`<button class="btn gold" style="height:40px;padding:0 16px" data-act="pro">Get Pro</button>`}</div></div></div>`:'';
  return `<div class="screen"><div class="scroll nonav">
  <div class="cover">${cover(g)}<div class="cover-top"><button class="ib onimg" data-act="back" aria-label="Back">${ic('back')}</button></div></div>
  <div style="padding:0 20px;margin-top:-34px;position:relative;display:flex;align-items:flex-end;gap:14px"><span style="padding:5px;background:var(--surface);border-radius:28px">${logo(g,76)}</span></div>
  <div style="padding:12px 20px 0"><h1 class="h1">${esc(g.title)}</h1><p class="muted" style="margin:4px 0 0">${g.custom?`<span class="tag">${ic('edit',2.5)}Custom game</span> You added this yourself`:esc(g.dev)}</p></div>
  <div class="quick">
    ${g.inList
      ? `<button class="btn tonal" data-act="remove" data-arg="${g.id}">${ic('check',2.5)}On your list</button>`
      : `<button class="btn gold" data-act="add" data-arg="${g.id}">${ic('plus',2.5)}Add to wishlist</button>`}
    ${g.inList?`<button class="ib ${g.alert?'on':''}" data-act="bell" aria-label="${g.alert?'Turn off alerts for this game':'Turn on alerts for this game'}" aria-pressed="${g.alert}">${ic(g.alert?'bell':'belloff')}</button>`:''}
    <button class="ib" data-act="share-game" data-arg="${g.id}" aria-label="Share ${esc(g.title)}">${ic('share')}</button>
  </div>
  <div class="chips" style="margin-top:16px" role="group" aria-label="Platform">${plats.map(p=>`<button class="chip ${sp===p?'on':''}" data-act="dplat" data-arg="${p}" aria-pressed="${sp===p}">${sp===p?ic('check',2.5):''}${PSHORT[p]}</button>`).join('')}</div>
  <div class="sec" style="padding-top:14px">${rel}</div>
  ${g.custom?`<div class="sec"><h2 class="h2">Your notes</h2><p style="margin:0">${esc(g.note||'No notes.')}</p><p class="muted small" style="margin:10px 0 0">WishPlay can't fetch covers, trailers or requirements for custom games. Your alerts still work.</p></div>`:`
  <div class="sec"><h2 class="h2">Trailer</h2>${g.trailer?`<button class="trailer" data-act="trailer" aria-label="Watch the ${esc(g.title)} trailer on YouTube">${cover(g)}<span class="play">${shape('c9','#FFB938')}<svg viewBox="0 0 24 24" style="position:absolute;inset:0;margin:auto;width:30px;height:30px" aria-hidden="true"><path d="M8 5v14l11-7z" fill="#16132E"/></svg></span><span class="cap">Watch on YouTube</span></button>`:`<div class="card" style="border:2px dashed var(--outv);background:transparent"><b>Trailer will be shared later</b><p class="muted small" style="margin:4px 0 0">We'll add it here as soon as the developer posts one.</p></div>`}</div>
  <div class="sec"><h2 class="h2">About</h2><p style="margin:0">${esc(g.about)}</p></div>
  ${reqs}
  <div class="sec"><h2 class="h2">Space needed</h2><div class="row-li"><span class="ic">${ic('drive')}</span><span class="grow"><b class="${size?'':'tba-text'}" style="${size?'font:800 22px/1.1 var(--display)':''}">${size||'Will be shared closer to launch'}</b><span class="muted small">On ${PSHORT[sp]}</span></span></div></div>
  ${priceSec}`}
  <div class="sec">${g.inList?`<button class="btn danger block" data-act="remove" data-arg="${g.id}">${ic('trash')}Remove from wishlist</button>`:`<button class="btn lg gold block" data-act="add" data-arg="${g.id}">${ic('plus')}Add to wishlist</button>`}</div>
  </div></div>`;
}

      </div></div>
    <div class="sec"><h2 class="h2">Your codes</h2>
      <label class="searchbar" style="margin:0">${ic('search')}<input id="codeq" type="text" placeholder="Find a code" value="${esc(S.codeQ)}" aria-label="Find a code" autocomplete="off">${S.codeQ?`<button class="ib" data-act="clear-codeq" aria-label="Clear">${ic('x')}</button>`:''}</label></div>
    <div class="group">${S.codes.map((c,i)=>({c,i})).filter(({c})=>!S.codeQ||c.code.toLowerCase().includes(S.codeQ.toLowerCase())).map(({c,i})=>{const used=c.uses>=c.max,live=c.on&&!used;return `<div class="row-li" style="flex-wrap:wrap;${live?'':'opacity:.62'}"><span class="ic" style="${c.type==='free'?'background:var(--pc);color:var(--onpc)':''}">${ic(c.type==='free'?'gift':'tag')}</span><span class="grow"><b class="codebox">${esc(c.code)}</b><span class="muted small">${c.type==='free'?'Free Pro':c.pct+'% off'}, ${c.uses} of ${c.max} used, ${used?'used up':'ends '+fmt(c.exp)}</span></span><button class="ib" data-act="copy" data-arg="${esc(c.code)}" aria-label="Copy ${esc(c.code)}">${ic('copy')}</button>${used?'':sw(c.on,'toggle-code',i,'Code '+c.code+' active')}</div>`}).join('')}</div>
  </div></div>`;
}

/* sheets */
function sheetHTML(){
  const s=S.sheet;if(!s)return'';
  let body='';
  if(s==='cap')body=`<b class="h1">Your list is full</b><p class="muted" style="margin:0">Free lists hold up to ${CAP} games. Remove one to make space, or get Pro for an unlimited list.</p><button class="btn lg gold block" data-act="pro">Get Pro for $${PRICE}</button><button class="btn tonal block" data-act="manage-list">Manage my list</button><button class="btn textbtn block" data-act="sheet-close">Not now</button>`;

  if(s==='sort')body=`<b class="h1">Sort your list</b>
    <div role="radiogroup" aria-label="Sort your list">${SORTS.map(([k,l,d])=>`<button class="radio" role="radio" aria-checked="${S.sort===k}" data-act="sort" data-arg="${k}"><span class="dotbox"></span><span class="grow">${l}<span class="muted">${d}</span></span></button>`).join('')}</div>
    <p class="muted small" style="margin:0">Sorting by release date also groups your list by month.</p>`;

  /* asked only after the first game is added, never at launch (Android 13+ rule) */
  if(s==='notif')body=`<b class="h1">Want a heads-up before it drops?</b>
    <p class="muted" style="margin:0">Android has to ask before WishPlay can send anything. Without it, nothing on your list can reach you.</p>
    <div class="notifmock"><span class="nm-ic">${ic('bell',2.5)}</span><span><b>Pocket Kingdoms is out today</b><p>Now on Android and iOS &middot; tap to open</p></span></div>
    <button class="btn lg gold block" data-act="notif-allow">Turn on notifications</button>
    <button class="btn textbtn block" data-act="notif-deny">Not now</button>
    <p class="muted small" style="margin:0">You can change this any time in Profile. Each alert type is its own Android channel, so you can mute them one by one.</p>`;

  if(s==='share')body=`<b class="h1">Share your wishlist</b>
    <p class="muted" style="margin:0">Anyone with the link sees a read-only copy. They can't add, remove or see your account.</p>
    <div class="row-li"><span class="ic">${ic('list')}</span><span class="grow"><b class="codebox">wishplay.app/l/nk4q2</b><span class="muted small">${listGames().length} games &middot; link stops working when you switch it off</span></span></div>
    <button class="btn lg gold block" data-act="copy" data-arg="wishplay.app/l/nk4q2">${ic('copy')}Copy link</button>
    <button class="btn tonal block" data-act="share-image">${ic('share')}Share as an image instead</button>
    <button class="btn textbtn block" data-act="sheet-close">Close</button>`;

  if(s==='battery')body=`<b class="h1">Keep the daily check alive</b>
    <p class="muted" style="margin:0">Some Android skins stop background work to save battery. If that happens, WishPlay can miss a date change.</p>
    <div class="group" style="margin:0">
      <div class="row-li"><span class="timeline-date" style="width:40px;height:40px;border-radius:14px"><b style="font-size:18px">1</b></span><span class="grow"><b>Open Android Settings</b><span class="muted small">Apps, then WishPlay</span></span></div>
      <div class="row-li"><span class="timeline-date" style="width:40px;height:40px;border-radius:14px"><b style="font-size:18px">2</b></span><span class="grow"><b>Battery, then Unrestricted</b><span class="muted small">Called "No restrictions" on some phones</span></span></div>
    </div>
    <button class="btn lg filled block" data-act="open-settings">Open Android settings</button>
    <button class="btn textbtn block" data-act="sheet-close">I'll do it later</button>`;

  if(s==='privacy')body=`<b class="h1">What WishPlay stores</b>
    <div class="kv"><span>We keep</span><span>Your Google ID, email, name, your list</span></div>
    <div class="kv"><span>We never collect</span><span>Ads, trackers, contacts, location</span></div>
    <div class="kv"><span>Crash reports</span><span>Stripped of personal data</span></div>
    <div class="kv"><span>On this phone</span><span>Encrypted database (SQLCipher)</span></div>
    <button class="btn lg tonal block" data-act="sheet-close">Got it</button>`;

  if(s==='delete')body=`<b class="h1" style="color:var(--err)">Delete your account?</b>
    <p class="muted" style="margin:0">This removes your wishlist, your Pro record and your profile from our servers. It cannot be undone, and buying Pro again would be a new purchase.</p>
    <div class="field"><label for="delc">Type DELETE to confirm</label><input class="input codebox" id="delc" placeholder="DELETE" autocomplete="off" style="text-transform:uppercase"></div>
    <button class="btn lg block" data-act="delete-confirm" style="background:var(--err);color:#fff">${ic('trash')}Delete my account</button>
    <button class="btn textbtn block" data-act="sheet-close">Keep my account</button>`;
  if(s==='signin')body=`<b class="h1">Sign in to get Pro</b><p class="muted" style="margin:0">Pro is saved to your Google account, so it comes back on a new phone or after a reinstall.</p><button class="btn lg filled block" data-act="google-in">${G_LOGO}<span>Sign in with Google</span></button><button class="btn textbtn block" data-act="sheet-close">Not now</button>`;
  if(s==='checkout')body=`<b class="h1">Pay with card</b><p class="muted" style="margin:0">Checkout opens in your browser. When the payment goes through, Pro unlocks here automatically.</p><div class="kv"><span>WishPlay Pro, lifetime</span><span>$${PRICE}</span></div><button class="btn lg filled block" data-act="checkout-done">Open secure checkout</button><button class="btn textbtn block" data-act="sheet-close">Cancel</button>`;
  if(s==='bkash')body=`<b class="h1">Pay with bKash</b>
    <div class="row-li"><span class="timeline-date" style="width:40px;height:40px;border-radius:14px"><b style="font-size:18px">1</b></span><span class="grow"><b>Send Money to <span class="codebox">${BKASH}</span></b><span class="muted small">${BDT} BDT. Use Send Money, not Payment.</span></span><button class="ib" data-act="copy" data-arg="${BKASH}" aria-label="Copy the bKash number">${ic('copy')}</button></div>
    <div class="row-li"><span class="timeline-date" style="width:40px;height:40px;border-radius:14px"><b style="font-size:18px">2</b></span><span class="grow"><b>Enter the Transaction ID</b><span class="muted small">It's in the bKash confirmation SMS.</span></span></div>
    <div class="field"><label for="trx">Transaction ID (TrxID)</label><input class="input codebox" id="trx" placeholder="e.g. BK7X4Q2M9A" autocomplete="off">${S.bkErr?'<span class="err">Enter the TrxID from your bKash SMS.</span>':''}</div>
    <button class="btn lg gold block" data-act="bkash-submit">Submit for approval</button><p class="muted small" style="margin:0">Pro unlocks once the payment is checked, usually within 24 hours.</p>`;
  if(s==='redeem'){const m=S.redeemMsg;body=`<b class="h1">Redeem a code</b><div class="field"><label for="code">Code</label><input class="input codebox" id="code" placeholder="WP-XXXX-XXXX" autocomplete="off" style="text-transform:uppercase"></div>${m?`<p style="margin:0;font-weight:600;color:${m.ok?'var(--ok)':'var(--err)'}">${esc(m.text)}</p>`:''}${m&&m.ok&&m.pct?`<button class="btn lg filled block" data-act="pay-card">Pay $${m.price} with card</button>`:`<button class="btn lg gold block" data-act="redeem-apply">Redeem</button>`}<p class="muted small" style="margin:0">Try WP-GIFT-7K2Q or WP-EID20 in this prototype.</p>`;}
  return `<button class="scrim" data-act="sheet-close" aria-label="Close"></button><div class="sheet" role="dialog" aria-modal="true"><span class="handle"></span>${body}</div>`;
}

/* ---------- render ---------- */
function render(){
  const t=top();
  let html;
  if(t.s==='onboard')html=onboard();
  else if(t.s==='tabs')html=tabs();
  else if(t.s==='details')html=details(t.id);
  else if(t.s==='custom')html=customForm();
  else if(t.s==='pro')html=proScreen();
  else if(t.s==='admin')html=adminScreen();
  else if(t.s==='calendar')html=calendarScreen();
  const key=t.s+(t.id||'')+(t.s==='tabs'?S.tab:'')+(t.s==='onboard'?S.onbStep:'');
  const keepScroll=key===lastKey&&document.getElementById('scroll-root');
  const prevScroll=keepScroll?keepScroll.scrollTop:0;
  const app=$('#app');
  app.className=S.accent!=='gold'&&isPro()?'accent-'+S.accent:'';
  app.innerHTML=html+sheetHTML()+(S.snack?`<div class="snack ${t.s==='tabs'?'':'nonav'}" role="status">${esc(S.snack)}</div>`:'');
  const scr=app.querySelector('.screen');const sc=app.querySelector('.scroll');
  if(sc){sc.id='scroll-root';if(keepScroll)sc.scrollTop=prevScroll}
  if(key!==lastKey&&scr)scr.classList.add(dir==='fwd'?'in-fwd':dir==='back'?'in-back':'in-fade');
  lastKey=key;dir='fade';
  if(t.s==='tabs'&&S.tab==='search')renderResults();
  $('#roleSeg').innerHTML=[['guest','Guest'],['free','Free'],['pro','Pro'],['admin','Admin']].map(([k,l])=>`<button class="${S.role===k?'on':''}" data-act="role" data-arg="${k}" aria-pressed="${S.role===k}">${l}</button>`).join('');
  if(S.theme==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',S.theme);
}
function renderResults(){const r=$('#results');if(r)r.innerHTML=resultsHTML()}
function push(o){S.stack.push(o);S.fab=false;S.sheet=null;dir='fwd';render()}
function back(){if(S.stack.length>1)S.stack.pop();S.sheet=null;dir='back';render()}
function snack(m){S.snack=m;render();clearTimeout(snackTimer);snackTimer=setTimeout(()=>{S.snack='';const el=document.querySelector('.snack');if(el)el.remove()},3000)}
/* one shared add path so the permission prompt fires on the first add, wherever it happens */
function addGame(id,fromDetails){
  const g=byId(id);
  if(g.inList&&!fromDetails){push({s:'details',id});return}
  if(!isPro()&&listGames().length>=CAP){S.sheet='cap';render();return}
  g.inList=true;g.ord=ordSeq++;
  if(!S.notifAsked){S.sheet='notif';render();return}
  snack(g.title+' added to your wishlist');
}
function goTabs(tab){S.stack=[{s:'tabs'}];if(tab)S.tab=tab;dir='fade';render()}

/* ---------- actions ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,arg=el.dataset.arg;
  const t=top();
  switch(a){
  case'google':S.role='free';S.onbStep=1;dir='fwd';render();break;
  case'guest':S.role='guest';S.onbStep=1;dir='fwd';render();break;
  case'onb-back':if(S.onbStep>1){S.onbStep--;dir='back';render()}else{S.onbStep=0;dir='back';render()}break;
  case'onb-skip':S.onbStep=0;goTabs('wishlist');snack('Skipped setup. You can change all of it in Profile.');break;
  case'onb-plat':{const i=S.prefPlats.indexOf(arg);if(i<0)S.prefPlats.push(arg);else S.prefPlats.splice(i,1);render();break}
  case'onb-next':S.onbStep=2;dir='fwd';render();break;
  case'onb-lead':S.alerts.lead=arg;render();break;
  case'onb-done':S.plat=S.prefPlats.length===1?S.prefPlats[0]:'All';S.onbStep=0;goTabs('wishlist');
    snack(S.prefPlats.length?'Set up for '+S.prefPlats.map(p=>PSHORT[p]).join(', '):'All set. Add your first game.');break;
  case'google-in':S.role='free';S.sheet=null;snack('Signed in. Your list is syncing now.');break;
  case'tab':S.tab=arg;S.fab=false;dir='fade';render();break;
  case'open':push({s:'details',id:arg});break;
  case'back':back();break;
  case'fab':S.fab=!S.fab;render();break;
  case'fab-search':S.fab=false;S.tab='search';dir='fade';if(t.s!=='tabs')S.stack=[{s:'tabs'}];render();setTimeout(()=>{const q=$('#q');if(q)q.focus()},60);break;
  case'fab-custom':push({s:'custom'});break;
  case'filter':S.filter=arg;render();break;
  case'plat':S.plat=arg;render();break;
  case'clear-q':e.preventDefault();S.query='';const q=$('#q');if(q){q.value='';q.focus()}renderResults();break;
  case'add':addGame(arg,t.s==='details');break;
  case'remove':{const g=byId(arg);g.inList=false;if(t.s==='details')render();else back();snack(g.title+' removed from your wishlist');break}
  case'sort-open':S.sheet='sort';render();break;
  case'sort':S.sort=arg;S.sheet=null;render();break;
  case'manage-list':S.sheet=null;S.stack=[{s:'tabs'}];S.tab='wishlist';S.filter='all';dir='back';render();break;
  case'notif-allow':S.notifAsked=true;S.notifOn=true;S.sheet=null;snack('Notifications on. You\'ll hear about releases, delays and reminders.');break;
  case'notif-deny':S.notifAsked=true;S.notifOn=false;S.sheet=null;snack('No notifications for now. Turn them on any time in Profile.');break;
  case'notif-settings':if(!S.notifOn){S.notifAsked=false;S.sheet='notif';render()}else snack('Opens Android settings, where each alert channel can be muted.');break;
  case'battery':S.sheet='battery';render();break;
  case'open-settings':S.sheet=null;snack('Opens Android app settings for WishPlay.');break;
  case'privacy':S.sheet='privacy';render();break;
  case'share-list':S.sheet='share';render();break;
  case'share-image':S.sheet=null;snack('Opens the Android share sheet with your list as an image.');break;
  case'share-game':{const g=byId(arg);S.sheet=null;snack('Shared '+g.title+' with a link back to WishPlay.');break}
  case'restore':S.sheet=null;if(S.role==='guest'){S.sheet='signin';render();break}snack(isPro()?'Pro is already active on this phone.':'No purchase found for this account.');break;
  case'delete-account':S.delOk=false;S.sheet='delete';render();break;
  case'delete-confirm':{const v=(($('#delc')||{}).value||'').trim().toUpperCase();
    if(v!=='DELETE'){snack('Type DELETE to confirm.');break}
    S.role='guest';S.accent='gold';S.sheet=null;S.stack=[{s:'onboard'}];S.onbStep=0;dir='fade';render();
    snack('Account deleted. Everything on our servers is gone.');break}
  case'calendar':push({s:'calendar'});break;
  case'cal-month':S.calMonth=arg;S.calDay=null;render();break;
  case'cal-day':S.calDay=+arg===S.calDay||+arg===0?null:+arg;render();break;
  case'recent':{S.query=arg;S.recent=[arg,...S.recent.filter(r=>r!==arg)].slice(0,6);render();setTimeout(()=>{const q=$('#q');if(q)q.value=arg},0);break}
  case'drop-recent':S.recent.splice(+arg,1);renderResults();break;
  case'clear-recent':S.recent=[];renderResults();break;
  case'clear-codeq':S.codeQ='';render();break;
  case'cquick':{const d=new Date(TODAY.getTime()+ +arg*864e5);const v=d.toISOString().slice(0,10);const f=$('#cdate');const tb=$('#ctba');if(tb&&tb.checked){tb.checked=false;f.disabled=false}f.value=v;break}
  case'dplat':S.selPlat[t.id]=arg;render();break;
  case'req':S.reqMode=arg;render();break;
  case'bell':{const g=byId(t.id);g.alert=!g.alert;snack(g.alert?'Alerts on for '+g.title:'Alerts off for '+g.title);break}
  case'trailer':snack('Opens the trailer in the YouTube app');break;
  case'pricealert':{const g=byId(t.id);g.priceAlert=!g.priceAlert;snack(g.priceAlert?'You\'ll hear about price drops for '+g.title:'Price alerts off for '+g.title);break}
  case'pro':S.sheet=null;push({s:'pro'});break;
  case'pay-card':S.sheet=S.role==='guest'?'signin':'checkout';render();break;
  case'pay-bkash':S.bkErr=false;S.sheet=S.role==='guest'?'signin':'bkash';render();break;
  case'redeem':S.redeemMsg=null;S.sheet=S.role==='guest'?'signin':'redeem';render();break;
  case'checkout-done':S.role='pro';S.sheet=null;S.redeemMsg=null;snack('Payment confirmed. Pro is yours for life.');break;
  case'bkash-submit':{const v=($('#trx').value||'').trim().toUpperCase();if(!v){S.bkErr=true;render();break}S.pending.unshift({trx:v,from:'You',when:'just now'});S.sheet=null;snack('Submitted. Pro unlocks once the payment is checked.');break}
  case'redeem-apply':{const v=($('#code').value||'').trim().toUpperCase();const c=S.codes.find(x=>x.code===v);
    if(!c||!c.on||c.uses>=c.max){S.redeemMsg={ok:false,text:'That code doesn\'t exist or has expired. Check it and try again.'};render();break}
    c.uses++;S.redeemed++;if(c.type==='free'){S.role='pro';S.sheet=null;S.redeemMsg=null;snack('Code redeemed. Pro is yours for life.')}
    else{const price=(PRICE*(100-c.pct)/100).toFixed(2);S.redeemMsg={ok:true,pct:true,price,text:c.pct+'% off applied. Lifetime Pro is now $'+price+'.'};render()}break}
  case'sheet-close':S.sheet=null;render();break;
  case'role':S.role=arg;if(t.s==='admin'&&arg!=='admin')S.stack.pop();if(t.s==='onboard')goTabs('wishlist');else render();break;
  case'jump':S.sheet=null;S.fab=false;
    if(arg==='onboard'){S.stack=[{s:'onboard'}];S.onbStep=0;dir='fade';render()}
    else if(arg==='calendar'){S.stack=[{s:'tabs'},{s:'calendar'}];S.tab='alerts';S.calMonth='2026-11';S.calDay=null;dir='fwd';render()}
    else if(arg==='cap'){if(isPro())S.role='free';S.stack=[{s:'tabs'}];S.tab='wishlist';S.sheet='cap';render()}
    else if(arg==='pro'){if(isPro())S.role='free';S.stack=[{s:'tabs'},{s:'pro'}];dir='fwd';render()}
    else if(arg==='admin'){S.role='admin';S.tab='profile';S.stack=[{s:'tabs'},{s:'admin'}];dir='fwd';render()}break;
  case'theme':S.theme=arg;render();break;
  case'accent':if(!isPro()){push({s:'pro'});break}S.accent=arg;render();break;
  case'widgets':if(!isPro()){push({s:'pro'});break}snack('Long-press your home screen, tap Widgets, then pick WishPlay.');break;
  case'admin':push({s:'admin'});break;
  case'atype':S.adminType=arg;render();break;
  case'create-code':{const pct=S.adminType==='pct'?Math.max(1,Math.min(99,parseInt(($('#cpct')||{}).value)||20)):0;const max=Math.max(1,parseInt($('#cmax').value)||1);const exp=$('#cexp').value||'2026-12-31';
    const rnd=()=>Math.random().toString(36).slice(2,6).toUpperCase().replace(/[01OI]/g,'X');
    const code=S.adminType==='free'?'WP-GIFT-'+rnd():'WP-'+pct+'OFF-'+rnd();
    S.codes.unshift({code,type:S.adminType,pct,uses:0,max,exp,on:true});snack(code+' created');break}
  case'copy':try{navigator.clipboard.writeText(arg)}catch(err){}snack(arg+' copied');break;
  case'toggle-code':{const c=S.codes[+arg];c.on=!c.on;snack(c.on?c.code+' is active again':c.code+' turned off. It can\'t be redeemed now.');break}
  case'approve':{const p=S.pending.splice(+arg,1)[0];S.redeemed++;snack('Approved '+p.trx+'. Pro unlocked for that account.');break}
  case'reject':{const p=S.pending.splice(+arg,1)[0];snack('Rejected '+p.trx+'. The buyer will be asked to check the TrxID.');break}
  case'alert':if(arg==='price'&&!isPro()){push({s:'pro'});break}S.alerts[arg]=!S.alerts[arg];render();break;
  case'lead':S.alerts.lead=arg;render();break;
  case'update':snack('You\'re on the latest version.');break;
  case'signout':S.role='guest';S.accent='gold';S.stack=[{s:'onboard'}];S.onbStep=0;dir='fade';render();break;
  case'cchip':{const on=el.classList.toggle('on');el.setAttribute('aria-pressed',on);break}
  case'ctba':{const d=$('#cdate');d.disabled=el.checked;if(el.checked)d.value='';break}
  case'save-custom':{const name=$('#cname').value.trim();if(!name){$('#cname-err').hidden=false;$('#cname').focus();break}
    if(!isPro()&&listGames().length>=CAP){S.sheet='cap';render();break}
    const plats=[...document.querySelectorAll('.cchip.on')].map(b=>b.dataset.arg);const date=$('#ctba').checked?null:($('#cdate').value||null);
    const pl={};(plats.length?plats:['Android']).forEach(p=>pl[p]=date);
    games.push({id:'c'+Date.now(),title:name,custom:true,hue:HUES[games.length%HUES.length],shape:'c9',platforms:pl,size:{},progress:.15,note:$('#cnote').value.trim(),inList:true,alert:true,ord:ordSeq++});
    S.filter='all';S.stack=[{s:'tabs'}];S.tab='wishlist';dir='back';
    if(!S.notifAsked){S.sheet='notif';render();break}
    snack(name+' added to your wishlist');break}
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.query=e.target.value;renderResults()}
  if(e.target.id==='codeq'){S.codeQ=e.target.value;render();const f=$('#codeq');if(f){f.focus();f.setSelectionRange(f.value.length,f.value.length)}}
  if(e.target.id==='cdate'||e.target.id==='cname'){
    const d=$('#cdate'),t=$('#cpreview-t'),s=$('#cpreview-s'),n=($('#cname')||{}).value;
    if(t)t.textContent=(n&&n.trim()?n.trim():'Your game')+(d&&d.value?' releases on '+fmtY(d.value):' releases today');
    if(s)s.textContent='This is the alert you\'ll get. We\'ll also remind you '+S.alerts.lead+' before.';
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.sheet||S.fab)){S.sheet=null;S.fab=false;render()}});
$('#demoLogo').innerHTML=brandIcon(44)+'<b>WishPlay</b>';
render();
})();
</script>
